name: Release

# Push a tag like v2.2.0 to build the release archive, publish the GitHub
# release, and register the version with the Foundry VTT package listing.
# Run manually (workflow_dispatch) to dry-run the Foundry API call only:
# it validates the token and request without creating anything.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to dry-run against the Foundry API (no leading v)"
        required: true
        default: "2.1.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MODULE_ID: vk-kingdom-turn-helper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        if: github.event_name == 'push'
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp version and download URL into module.json
        if: github.event_name == 'push'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" \
             --arg dl "$REPO_URL/releases/download/v$VERSION/$MODULE_ID-v$VERSION.zip" \
             '.version = $v | .download = $dl' module.json > module.json.tmp
          mv module.json.tmp module.json

      - name: Build module archive
        if: github.event_name == 'push'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          zip -r "$MODULE_ID-v$VERSION.zip" \
            module.json scripts styles lang packs img LICENSE README.md

      - name: Create GitHub release and upload assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="$MODULE_ID-v$VERSION.zip"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber module.json "$ZIP"
          else
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" \
              --title "v$VERSION" --generate-notes module.json "$ZIP"
          fi

      - name: Publish release to Foundry VTT
        env:
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
        run: |
          if [ -z "$FOUNDRY_RELEASE_TOKEN" ]; then
            echo "::error::The FOUNDRY_RELEASE_TOKEN repository secret is not set. Copy the Package Release Token from https://foundryvtt.com/packages/vk-kingdom-turn-helper/edit and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            DRY_RUN=true
            echo "Dry run: validating a hypothetical v$VERSION release against the Foundry API (nothing will be saved)."
          else
            VERSION="${{ steps.version.outputs.version }}"
            DRY_RUN=false
          fi
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          BODY=$(jq -n \
            --arg id "$MODULE_ID" \
            --argjson dry "$DRY_RUN" \
            --arg v "$VERSION" \
            --arg manifest "$REPO_URL/releases/download/v$VERSION/module.json" \
            --arg notes "$REPO_URL/releases/tag/v$VERSION" \
            --slurpfile m module.json \
            '{id: $id, "dry-run": $dry, release: {version: $v, manifest: $manifest, notes: $notes, compatibility: $m[0].compatibility}}')
          HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "https://api.foundryvtt.com/_api/packages/release_version/" \
            -H "Content-Type: application/json" \
            -H "Authorization: $FOUNDRY_RELEASE_TOKEN" \
            --data "$BODY")
          cat response.json
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Foundry VTT package release failed with HTTP $HTTP_STATUS (see response above)."
            exit 1
          fi
